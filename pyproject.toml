[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goalevolve"
version = "1.0.0"
description = "Evidence-driven OpenROAD source evolution with reproducible artifact evaluation"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-cpp==0.23.4",
]

[project.scripts]
goalevolve = "goalevolve.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/artifact"]
addopts = "-q"
# Keep the in-tree package importable for the documented `pytest` command.
# This project deliberately has no installation step for local campaigns.
pythonpath = ["."]

[tool.setuptools]
packages = [
  "goalevolve",
  "goalevolve.agents",
  "goalevolve.core",
  "goalevolve.evaluation",
  "goalevolve.execution",
  "goalevolve.planning",
  "goalevolve.testing",
]
